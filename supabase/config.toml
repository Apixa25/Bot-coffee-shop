# Supabase configuration file
# For local development and deployment reference

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Edge Functions
[functions]
enabled = true

[[functions.join-meetup]]
verify_jwt = false

[[functions.post-message]]
verify_jwt = false

[[functions.read-messages]]
verify_jwt = false

[[functions.propose-learning]]
verify_jwt = false
